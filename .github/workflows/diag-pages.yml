# 临时诊断：把 Pages 启用接口的真实返回写回仓库，便于读取。
# 失败原因无法通过未认证的 API 读到（日志接口需要管理员权限），
# 因此让 workflow 自己把响应写进分支，再从 raw.githubusercontent.com 读取。
name: diag-pages

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/diag-pages.yml'

permissions:
  contents: write
  pages: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query and attempt to enable Pages, record raw response
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          {
            echo "{"
            echo "\"repo\": \"$REPO\","
            echo "\"token_permissions_header\": \"$(curl -s -D - -o /dev/null "https://api.github.com/repos/$REPO" | grep -i '^x-accepted' | head -1)\","
            echo "\"get_pages\": \"$(curl -s -o /tmp/get.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/pages")\","
            echo "\"get_pages_body\": $(node -e "console.log(JSON.stringify(require('fs').readFileSync('/tmp/get.json','utf8')))"),"
            echo "\"post_pages\": \"$(curl -s -o /tmp/post.json -w '%{http_code}' -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' -d '{"build_type":"workflow"}' "https://api.github.com/repos/$REPO/pages")\","
            echo "\"post_pages_body\": $(node -e "console.log(JSON.stringify(require('fs').readFileSync('/tmp/post.json','utf8')))"),"
            echo "\"actions_permissions\": \"$(curl -s -o /tmp/perm.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/actions/permissions/workflow")\","
            echo "\"actions_permissions_body\": $(node -e "console.log(JSON.stringify(require('fs').readFileSync('/tmp/perm.json','utf8')))"),"
            echo "\"pages_after\": \"$(curl -s -o /tmp/after.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$REPO/pages")\","
            echo "\"pages_after_body\": $(node -e "console.log(JSON.stringify(require('fs').readFileSync('/tmp/after.json','utf8')))")"
            echo "}"
          } > diag-pages.json
          cat diag-pages.json

      - name: Push diagnostics to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b diagnostics
          git add diag-pages.json
          git commit -m "diag: pages api response"
          git push -f origin diagnostics
