<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#04070d" />
    <title>轨道之上：一片正在增厚的碎片带</title>
    <meta
      name="description"
      content="用真实轨道编目数据讲述近地轨道的拥挤程度。数据来源 CelesTrak，历元 2026-10-13。"
    />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- 三维场景层：固定铺满视口，作为整页的背景与主视觉 -->
    <div class="scene-layer" aria-hidden="true">
      <canvas id="scene"></canvas>
      <div class="scene-vignette"></div>
    </div>

    <!--
      载入遮罩：三维场景与 16,000 个点云尚未就绪时盖住画面。
      数据全部是本地静态文件，正常情况下不到一秒就会撤掉；
      没有它会出现一次从空场景到满屏点云的闪烁。
    -->
    <div class="boot-veil" id="boot-veil">
      <div class="veil-mark" aria-hidden="true"></div>
      <p id="boot-status">正在载入轨道编目</p>
    </div>

    <!-- 顶部仪表条：作品名 / 数据出处 / 视图状态，常驻 -->
    <header class="hud hud-top">
      <div class="hud-cell hud-title">
        <svg class="mark" viewBox="0 0 32 32" width="20" height="20" aria-hidden="true" focusable="false">
          <circle cx="12.6" cy="20.2" r="4.9" fill="#0a1622" stroke="#7fc7e6" stroke-width="1.4" />
          <path d="M6.2 14.4A9.2 9.2 0 0 1 21.6 14.9" fill="none" stroke="#4fc3f7"
            stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
          <path d="M3.2 11.2A13.6 13.6 0 0 1 27 11.7" fill="none" stroke="#ff6b35"
            stroke-width="3" stroke-linecap="round" />
          <circle cx="27" cy="11.7" r="1.6" fill="#ff6b35" />
        </svg>
        <span class="title-cn">轨道之上</span>
        <span class="title-sub">一片正在增厚的碎片带</span>
      </div>
      <div class="hud-cell hud-provenance">
        <span class="field">
          <span class="field-key">数据来源</span>
          <span class="field-val">CelesTrak</span>
        </span>
        <span class="field">
          <span class="field-key">数据历元</span>
          <span class="field-val mono" id="epoch-value">2026-10-13</span>
        </span>
      </div>
      <!-- 模式导航：放在页眉中间的空白处。
           叙事是默认阅读方式；自由探索把页面锁成一屏、由读者自己筛；
           讲解是答辩用的自动巡游。三者互斥，当前模式在这里回显。 -->
      <nav class="mode-nav" id="mode-nav" aria-label="视图模式">
        <button class="mode-btn mono" type="button" data-mode="story" aria-pressed="true">叙事</button>
        <button class="mode-btn mono" type="button" data-mode="explore" aria-pressed="false">自由探索</button>
        <button class="mode-btn mono" type="button" data-mode="tour" aria-pressed="false">讲解</button>
      </nav>
      <div class="hud-cell hud-view">
        <span class="field">
          <span class="field-key">视距</span>
          <span class="field-val mono" id="readout-distance">-</span>
        </span>
        <!-- 窄屏时挤不下，用 CSS 隐藏；只在第二章的时间切片里出现 -->
        <span class="field field-year" id="field-year" hidden>
          <span class="field-key">时间切片</span>
          <span class="field-val mono"><span id="readout-year">-</span><small>年末</small></span>
        </span>
        <span class="field">
          <span class="field-key">帧率</span>
          <span class="field-val mono" id="readout-fps">-</span>
        </span>
      </div>
    </header>

    <!--
      叙事栏：章节步骤在运行时按数据生成后插入 #story。
      文案不在 HTML 里写死，因为其中的数字必须来自当前数据包，
      写成静态文本会出现「改了数据、文案没跟着变」的错位。
    -->
    <!--
      场景标注层：高度环、轨道面与短标签。
      球在底层，标注贴在球上；这一层不接收指针事件，拖动与点选仍然落在画布上。
      内容由 main.ts 按步骤写入，文字只有「是什么 / 多少」两行。
    -->
    <div class="anno-layer" id="anno-layer" aria-hidden="true"></div>

    <!--
      比例尺：把「屏幕上一段长度 = 多少公里」标出来。
      它随视距实时换算，读者因此能判断画面里那条轨道离地面多远。
    -->
    <div class="scale-bar" id="scale-bar" aria-hidden="true">
      <span class="scale-rule" id="scale-rule"></span>
      <span class="scale-label mono" id="scale-label">-</span>
    </div>

    <!--
      悬停探针：指针停在球上时，在指针旁报出最近那个点是什么。
      这是「点选」的低成本预览版：不点也能知道那里有什么。
    -->
    <div class="probe" id="probe" hidden aria-hidden="true">
      <span class="probe-dot"></span>
      <span class="probe-label mono" id="probe-label">-</span>
    </div>

    <main id="story"></main>

    <!--
      常驻图例与筛选回显。
      颜色是本页唯一的编码通道（类别、碎片群、时间切片），没有图例时
      读者只能靠猜。图例本身可点：点一行就只看那一类，同一块区域先给
      编码说明、再给验证入口。筛选项会在这里回显，并给一键清除。
    -->
    <div class="legend-layer" id="legend-layer"></div>

    <!--
      点选标记：读者点中某个点后，在球上留一个回环，镜头转动时它跟着那个点走。
      没有它时读数卡一关，读者就再也找不到刚才看的是哪一个。
    -->
    <div class="pick-marker" id="pick-marker" hidden aria-hidden="true">
      <span class="pick-marker-ring"></span>
    </div>

    <!--
      仪器层：每章挂一台带刻度、可操作的仪器（高度尺、年份轴、直方图等）。
      与三维场景叠在同一个视口里，球在底层，仪器在上层。
      内容由 src/core/instrument.ts 在运行时按场景挂载，不在 HTML 里写死。
    -->
    <div class="instrument-layer" id="instrument-layer" aria-live="off"></div>

    <!--
      对象读数卡：点三维场景里任意一个点后弹出，显示该对象的类别、
      高度、倾角与发射年。位置由 main.ts 按点击坐标写入。
    -->
    <div class="pick-card" id="pick-card" hidden>
      <button class="pick-close" id="pick-close" type="button" aria-label="关闭读数卡">×</button>
      <p class="pick-kicker mono" id="pick-kind">-</p>
      <p class="pick-name" id="pick-name">-</p>
      <dl class="pick-rows" id="pick-rows"></dl>
    </div>

    <!--
      尾页：数据与方法。
      这不是附录，而是参赛要求里「注明资料来源」与「可核验」的直接落点，
      因此作为正式章节放在叙事之后。
    -->
    <section class="methods" id="methods" aria-label="数据与方法"></section>

    <footer class="hud hud-bottom">
      <div class="hud-cell hud-stages" id="stage-ticks" role="navigation" aria-label="章节进度"></div>
      <div class="hud-cell hud-counts">
        <span class="field">
          <span class="field-key">渲染对象</span>
          <span class="field-val mono" id="readout-points">-</span>
        </span>
        <span class="field">
          <span class="field-key">像素比</span>
          <span class="field-val mono" id="readout-quality">-</span>
        </span>
      </div>
    </footer>

    <!--
      屏幕阅读器公告区：页面的大部分状态变化发生在 canvas 与 SVG 里，
      读屏软件读不到。这里只放「当前做了什么筛选」这一类短句，
      用 aria-live=polite 播报，不打断读者。
    -->
    <p class="sr-only" id="sr-status" role="status" aria-live="polite"></p>

    <noscript>
      <div class="noscript">
        <h1>轨道之上</h1>
        <p>本作品使用 WebGL 实时渲染三维轨道场景，需要启用 JavaScript 才能观看。</p>
        <p>数据来源 CelesTrak，历元 2026-10-13（UTC）。</p>
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
